<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معاينة الإطارات الرياضية</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f1a;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
  }
  h1 { font-size: 1.1em; color: #f0b90b; margin-top: 10px; }
  .subtitle { font-size: 0.75em; color: #888; }

  .frames-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 500px;
    width: 100%;
  }

  .frame-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    padding: 12px 8px;
    border-radius: 16px;
    background: #1a1a2e;
    border: 2px solid transparent;
    transition: border 0.2s, transform 0.15s;
  }
  .frame-card:hover { transform: scale(1.04); }
  .frame-card.selected { border-color: #f0b90b; background: #1e1a0a; }

  .frame-label { font-size: 0.65em; color: #aaa; font-weight: 700; text-align: center; }
  .frame-price { font-size: 0.6em; color: #f0b90b; font-weight: 900; }
  .frame-active-badge {
    font-size: 0.55em;
    background: #f0b90b;
    color: #000;
    border-radius: 8px;
    padding: 2px 8px;
    font-weight: 900;
  }

  /* ──────── حاوية الإطار ──────── */
  .avatar-wrapper {
    position: relative;
    width: 80px;
    height: 80px;
  }

  /* الصورة/الإيموجي داخل الإطار */
  .avatar-inner {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, #2a2a4a, #1a1a30);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2em;
    overflow: hidden;
  }

  /* ═══════════════════ SVG FRAME OVERLAY ═══════════════════ */
  .frame-svg {
    position: absolute;
    inset: -8px;
    width: calc(100% + 16px);
    height: calc(100% + 16px);
    pointer-events: none;
  }

  /* ══ معاينة كبيرة ══ */
  .big-preview {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .big-preview .avatar-wrapper {
    width: 110px;
    height: 110px;
  }
  .big-preview .avatar-inner { font-size: 3em; }
  .big-preview .frame-svg {
    inset: -12px;
    width: calc(100% + 24px);
    height: calc(100% + 24px);
  }
  .preview-name { font-size: 0.9em; font-weight: 900; }
  .preview-sub  { font-size: 0.7em; color: #888; }
</style>
</head>
<body>

<h1>🖼️ معاينة الإطارات الرياضية</h1>
<p class="subtitle">إطارات ديكورية ثابتة — رموز رياضية حول الصورة</p>

<!-- معاينة كبيرة -->
<div class="big-preview">
  <div class="avatar-wrapper" id="bigAvatar">
    <div class="avatar-inner">👦</div>
    <svg class="frame-svg" id="bigFrameSvg" viewBox="0 0 130 130"></svg>
  </div>
  <div class="preview-name" id="bigName">بدون إطار</div>
  <div class="preview-sub">اختر إطاراً من الأسفل</div>
</div>

<!-- شبكة الإطارات -->
<div class="frames-grid" id="framesGrid"></div>

<script>
/* ══════════════════════════════════════════════════════
   تعريف الإطارات — SVG ثابت بعناصر رياضية
══════════════════════════════════════════════════════ */
const FRAMES = [
  {
    id: 'none',
    label: 'بدون إطار',
    price: 0,
    free: true,
    svgContent: () => '',
  },
  {
    id: 'calculator',
    label: '🔢 أرقام',
    price: 15,
    svgContent: () => {
      /* أرقام ورموز حول الدائرة */
      const items = ['1','2','3','+','×','÷','=','%','π','∞','√','7'];
      return items.map((char, i) => {
        const angle = (i / items.length) * 360 - 90;
        const rad = angle * Math.PI / 180;
        const x = 65 + 56 * Math.cos(rad);
        const y = 65 + 56 * Math.sin(rad);
        return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central"
          font-size="9" font-weight="900" fill="#f0b90b" font-family="monospace"
          transform="rotate(${angle+90}, ${x}, ${y})">${char}</text>`;
      }).join('') +
      `<circle cx="65" cy="65" r="53" fill="none" stroke="#f0b90b" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.5"/>`;
    }
  },
  {
    id: 'tools',
    label: '📐 أدوات',
    price: 20,
    svgContent: () => {
      /* أدوات دراسية: قلم، مسطرة، دفتر، قلم رصاص */
      const icons = ['✏️','📐','📏','📚','🖊️','📓','✏️','📐'];
      return icons.map((icon, i) => {
        const angle = (i / icons.length) * 360 - 90;
        const rad = angle * Math.PI / 180;
        const x = 65 + 54 * Math.cos(rad);
        const y = 65 + 54 * Math.sin(rad);
        return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central"
          font-size="11" transform="rotate(${angle+90}, ${x}, ${y})">${icon}</text>`;
      }).join('') +
      `<circle cx="65" cy="65" r="51" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.6"/>
       <circle cx="65" cy="65" r="57" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2 4" opacity="0.3"/>`;
    }
  },
  {
    id: 'equations',
    label: '➕ معادلات',
    price: 25,
    svgContent: () => {
      const items = ['a²','b²','=','c²','∑','∫','Δ','∓','≠','≈','∝','∞'];
      return items.map((char, i) => {
        const angle = (i / items.length) * 360 - 90;
        const rad = angle * Math.PI / 180;
        const x = 65 + 55 * Math.cos(rad);
        const y = 65 + 55 * Math.sin(rad);
        return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central"
          font-size="8" font-weight="700" fill="#10b981" font-family="serif"
          transform="rotate(${angle+90}, ${x}, ${y})">${char}</text>`;
      }).join('') +
      `<circle cx="65" cy="65" r="52" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.6"/>
       <circle cx="65" cy="65" r="59" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="1 5" opacity="0.3"/>`;
    }
  },
  {
    id: 'stars',
    label: '⭐ نجوم',
    price: 18,
    svgContent: () => {
      /* نجوم + أرقام بالتناوب */
      const items = ['⭐','5','🌟','10','⭐','15','🌟','20'];
      return items.map((icon, i) => {
        const angle = (i / items.length) * 360 - 90;
        const rad = angle * Math.PI / 180;
        const x = 65 + 54 * Math.cos(rad);
        const y = 65 + 54 * Math.sin(rad);
        const isEmoji = isNaN(icon);
        if (isEmoji) {
          return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central"
            font-size="12">${icon}</text>`;
        }
        return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central"
          font-size="7" font-weight="900" fill="#f59e0b" font-family="monospace">${icon}</text>`;
      }).join('') +
      `<circle cx="65" cy="65" r="51" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>`;
    }
  },
  {
    id: 'geometry',
    label: '📐 هندسة',
    price: 30,
    hot: true,
    svgContent: () => {
      /* مثلثات ودوائر وأشكال هندسية كأيقونات */
      const shapes = [
        `<polygon points="65,11 72,24 58,24" fill="none" stroke="#7c3aed" stroke-width="2"/>`,
        `<circle cx="119" cy="65" r="7" fill="none" stroke="#7c3aed" stroke-width="2"/>`,
        `<rect x="54" y="106" width="22" height="14" rx="3" fill="none" stroke="#7c3aed" stroke-width="2"/>`,
        `<circle cx="11" cy="65" r="7" fill="none" stroke="#7c3aed" stroke-width="2"/>`,
        `<polygon points="38,30 45,43 31,43" fill="none" stroke="#a855f7" stroke-width="1.5"/>`,
        `<polygon points="92,88 99,101 85,101" fill="none" stroke="#a855f7" stroke-width="1.5"/>`,
        `<rect x="15" y="38" width="14" height="10" rx="2" fill="none" stroke="#a855f7" stroke-width="1.5"/>`,
        `<rect x="100" y="82" width="14" height="10" rx="2" fill="none" stroke="#a855f7" stroke-width="1.5"/>`,
      ];
      return shapes.join('') +
      `<circle cx="65" cy="65" r="53" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 3" opacity="0.5"/>`;
    }
  },
  {
    id: 'champion',
    label: '🏆 بطل',
    price: 50,
    lvlReq: 5,
    svgContent: () => {
      /* كأس + نجوم + أرقام ذهبية */
      const items = ['🏆','1','🥇','★','🏆','∞','🥇','★'];
      return items.map((icon, i) => {
        const angle = (i / items.length) * 360 - 90;
        const rad = angle * Math.PI / 180;
        const x = 65 + 54 * Math.cos(rad);
        const y = 65 + 54 * Math.sin(rad);
        const isEmoji = isNaN(icon.replace('★',''));
        if (isEmoji || icon === '★') {
          return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central"
            font-size="${icon === '★' ? '14' : '13'}" fill="${icon === '★' ? '#f0b90b' : ''}">${icon}</text>`;
        }
        return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central"
          font-size="9" font-weight="900" fill="#f0b90b">${icon}</text>`;
      }).join('') +
      `<circle cx="65" cy="65" r="51" fill="none" stroke="#f0b90b" stroke-width="3" opacity="0.7"/>
       <circle cx="65" cy="65" r="57" fill="none" stroke="#f0b90b" stroke-width="1" stroke-dasharray="2 3" opacity="0.3"/>`;
    }
  },
  {
    id: 'science',
    label: '🔬 علوم',
    price: 35,
    hot: true,
    svgContent: () => {
      const items = ['🔬','⚗️','🔭','🧪','⚛️','🧲','🔬','⚗️'];
      return items.map((icon, i) => {
        const angle = (i / items.length) * 360 - 90;
        const rad = angle * Math.PI / 180;
        const x = 65 + 54 * Math.cos(rad);
        const y = 65 + 54 * Math.sin(rad);
        return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central"
          font-size="12" transform="rotate(${angle+90}, ${x}, ${y})">${icon}</text>`;
      }).join('') +
      `<circle cx="65" cy="65" r="51" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5"/>`;
    }
  },
  {
    id: 'legend',
    label: '⭐ أسطوري',
    price: 80,
    lvlReq: 12,
    hot: true,
    svgContent: () => {
      /* تدرج ذهبي مع رموز متنوعة */
      const items = ['π','e','∞','√','∑','∫','Δ','φ','α','β','γ','θ'];
      const outer = items.map((char, i) => {
        const angle = (i / items.length) * 360 - 90;
        const rad = angle * Math.PI / 180;
        const x = 65 + 57 * Math.cos(rad);
        const y = 65 + 57 * Math.sin(rad);
        return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central"
          font-size="8" font-weight="900" font-family="serif"
          fill="url(#goldGrad)" transform="rotate(${angle+90}, ${x}, ${y})">${char}</text>`;
      }).join('');
      return `<defs>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f0b90b"/>
          <stop offset="50%" stop-color="#fff5b0"/>
          <stop offset="100%" stop-color="#e5a800"/>
        </linearGradient>
      </defs>` + outer +
      `<circle cx="65" cy="65" r="53" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8"/>
       <circle cx="65" cy="65" r="59" fill="none" stroke="#f0b90b" stroke-width="1" stroke-dasharray="1 4" opacity="0.4"/>
       <circle cx="65" cy="65" r="48" fill="none" stroke="#f0b90b" stroke-width="0.5" opacity="0.2"/>`;
    }
  },
];

/* ══ رسم الشبكة ══ */
let selectedId = 'none';

function renderGrid() {
  const grid = document.getElementById('framesGrid');
  grid.innerHTML = FRAMES.map(f => {
    const active = f.id === selectedId;
    return `<div class="frame-card ${active ? 'selected' : ''}" onclick="selectFrame('${f.id}')">
      <div class="avatar-wrapper">
        <div class="avatar-inner">👦</div>
        <svg class="frame-svg" viewBox="0 0 130 130">${f.svgContent()}</svg>
      </div>
      <div class="frame-label">${f.label}</div>
      ${f.hot ? '<div style="font-size:0.55em;color:#ef4444;font-weight:900;">🔥 رائج</div>' : ''}
      ${f.lvlReq ? `<div style="font-size:0.55em;color:#f97316;">🔒 Lv.${f.lvlReq}</div>` : ''}
      ${active
        ? '<div class="frame-active-badge">✅ مفعّل</div>'
        : `<div class="frame-price">${f.free ? '🆓 مجاني' : f.price + ' 💰'}</div>`}
    </div>`;
  }).join('');
}

function selectFrame(id) {
  selectedId = id;
  renderGrid();
  /* تحديث المعاينة الكبيرة */
  const frame = FRAMES.find(f => f.id === id);
  document.getElementById('bigFrameSvg').innerHTML = frame ? frame.svgContent() : '';
  document.getElementById('bigName').textContent = frame ? frame.label : '';
}

renderGrid();
</script>
</body>
</html>
